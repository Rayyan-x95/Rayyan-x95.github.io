<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="view-transition" content="same-origin">
    
    <title>404 - Page Not Found | Mohammed Rayyan Portfolio</title>
    <meta name="description" content="The page you are looking for does not exist. Return to Mohammed Rayyan's portfolio - Graphic Designer, Engineering Student & ROM Developer.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://rayyan-x95.github.io/">
    
    <!-- Open Graph -->
    <meta property="og:title" content="404 - Page Not Found | Mohammed Rayyan">
    <meta property="og:description" content="This page doesn't exist. Visit Mohammed Rayyan's portfolio instead.">
    <meta property="og:url" content="https://rayyan-x95.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mohammed Rayyan - Graphic Designer & ROM Developer Portfolio">

    <!-- Theme Color -->
    <meta name="theme-color" content="#5b4cdb">
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Critical Inline Script: match theme from main site -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0f1a' : '#5b4cdb');
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Google Sans Flex', sans-serif;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        [data-theme="light"] body {
            background-color: #f0eef6;
            background: linear-gradient(135deg, #f0eef6, #e8e4f4, #ddd8ee);
            color: #0c0a1d;
        }
        
        .error-container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 12rem;
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 6s ease-in-out infinite;
        }

        [data-theme="light"] .error-code {
            background: linear-gradient(to right, #5b4cdb 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        
        .error-message {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }
        
        .error-description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            max-width: 500px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
        }

        [data-theme="light"] .error-description {
            color: rgba(12, 10, 29, 0.6);
        }
        
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.4);
        }
        
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(118, 75, 162, 0.6);
        }
        
        /* Background Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 1;
        }
        
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #764ba2;
            animation: moveBlob1 20s infinite alternate;
        }

        [data-theme="light"] .blob-1 {
            background: #b4a3e0;
            opacity: 0.3;
        }
        
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: #4facfe;
            animation: moveBlob2 15s infinite alternate;
        }

        [data-theme="light"] .blob-2 {
            background: #93b8f7;
            opacity: 0.3;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes moveBlob1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }
        
        @keyframes moveBlob2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, -50px) scale(1.1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .error-code, .blob-1, .blob-2 { animation: none; }
            body { transition: none; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">
            Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i>
            Back to Home
        </a>
    </div>

</body>
</html>
